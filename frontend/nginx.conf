server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  # Plain HTTP sent to this port is redirected to HTTPS on the same port.
  error_page 497 https://$host:$server_port$request_uri;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  gzip_min_length 1024;

  # Proxy da API — ajuste "backend:8000" para o service correto do seu docker-compose
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
  }

  # SPA fallback — todas as rotas caem no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache dos assets buildados (hashed)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
